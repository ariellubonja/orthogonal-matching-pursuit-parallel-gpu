[build-system]
requires = ["setuptools>=64", "Cython>=3.0", "numpy>=1.21", "scipy>=1.7"]
build-backend = "setuptools.build_meta"

[project]
name = "batched-omp"
version = "0.1.0"
description = "Batched Orthogonal Matching Pursuit for CPU and GPU"
authors = [
    {name = "Ariel Lubonja"},
    {name = "Sebastian Praesius"},
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "Cython>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
